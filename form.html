<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Lanre Ojo">

    <title>Product Review Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <fieldset>
                <legend>Product Information</legend>

                <label for="product">Product Name <span>*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- JavaScript will populate options -->
                </select>
            </fieldset>

            <!-- Rating -->
            <fieldset>
                <legend>Overall Rating <span>*</span></legend>

                <label>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    ☆
                </label>

                <label>
                    <input type="radio" id="rating2" name="rating" value="2">
                    ☆☆
                </label>

                <label>
                    <input type="radio" id="rating3" name="rating" value="3">
                    ☆☆☆
                </label>

                <label>
                    <input type="radio" id="rating4" name="rating" value="4">
                    ☆☆☆☆
                </label>

                <label>
                    <input type="radio" id="rating5" name="rating" value="5">
                    ☆☆☆☆☆
                </label>
            </fieldset>

            <!-- Installation Date -->
            <fieldset>
                <legend>Installation</legend>

                <label for="installDate">Date of Installation <span>*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </fieldset>

            <!-- Features -->
            <fieldset>
                <legend>Useful Features <em>(Check all that apply)</em></legend>

                <label>
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label>
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label>
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review -->
            <fieldset>
                <legend>Written Review</legend>

                <label for="review">
                    Your Review <small>(Optional)</small>
                </label>

                <textarea id="review" name="review" rows="6"></textarea>
            </fieldset>

            <!-- User Name -->
            <fieldset>
                <legend>User Information</legend>

                <label for="username">
                    Your Name <small>(Optional)</small>
                </label>

                <input type="text" id="username" name="username">
            </fieldset>

            <!-- Submit -->
            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Lanre Ojo | Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
